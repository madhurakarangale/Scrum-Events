<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScrumFlow Pro · Enterprise Agile Management</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-container">

  <!-- ===== TOP BAR ===== -->
  <header class="top-bar">
    <a href="#" class="brand">
      <i class="fas fa-code-branch"></i>
      <span>ScrumFlow</span><span class="brand-light">Pro</span>
    </a>
    <div class="top-actions">
      <div class="velocity-pill">
        <i class="fas fa-rocket"></i> Velocity
        <span id="velocityDisplay">0</span>
      </div>
      <!-- <div class="tenant-selector" title="Team workspace">
        <i class="fas fa-users"></i> Development Team
        <i class="fas fa-chevron-down" style="font-size: 0.6rem; opacity: 0.6;"></i>
      </div> -->
    </div>
  </header>

  <!-- ===== MAIN GRID ===== -->
  <div class="main-grid">

    <!-- LEFT COLUMN: Stories -->
    <div class="card">
      <div class="card-header">
        <i class="fas fa-list-ul"></i> User Stories
        <span class="badge-count" id="storyCount">0</span>
      </div>

      <div class="story-form">
        <div class="form-row">
          <input type="text" id="storyTitleInput" placeholder="Story title (e.g. 'Login with Google')" />
          <select id="storyPointsSelect">
            <option value="1">1 pt</option>
            <option value="2" selected>2 pts</option>
            <option value="3">3 pts</option>
            <option value="5">5 pts</option>
            <option value="8">8 pts</option>
            <option value="13">13 pts</option>
          </select>
          <button id="addStoryBtn"><i class="fas fa-plus-circle"></i> Add</button>
        </div>
        <div class="action-row">
          <button class="btn-outline" id="exportJsonBtn"><i class="fas fa-file-export"></i> Export JSON</button>
          <button class="btn-outline" id="importJsonBtn"><i class="fas fa-file-import"></i> Import JSON</button>
          <input type="file" id="fileInput" accept=".json" style="display:none">
        </div>
      </div>

      <div class="story-list" id="storyListContainer">
        <div class="empty-state">
          <i class="fas fa-inbox"></i>
          No stories yet — add one above.
        </div>
      </div>

      <div class="legend">
        <span><i class="fas fa-circle" style="color: var(--success);"></i> To do</span>
        <span><i class="fas fa-circle" style="color: var(--primary);"></i> In progress</span>
        <span><i class="fas fa-circle" style="color: var(--accent);"></i> Done</span>
      </div>
    </div>

    <!-- RIGHT COLUMN: Task Board + Velocity + History -->
    <div class="right-col">

      <!-- Task Board -->
      <div class="card" style="padding-bottom: 0.8rem;">
        <div class="card-header">
          <i class="fas fa-tasks"></i> Task Board
          <span class="badge-count" id="totalTasksCount">0</span>
        </div>
        <div class="task-columns">
          <div class="task-col" data-status="todo">
            <h4><span><i class="far fa-circle"></i> To Do</span> <span class="count" id="todoCount">0</span></h4>
            <div id="todoList" class="task-list"></div>
          </div>
          <div class="task-col" data-status="inprogress">
            <h4><span><i class="fas fa-spinner"></i> In Progress</span> <span class="count" id="inprogressCount">0</span></h4>
            <div id="inprogressList" class="task-list"></div>
          </div>
          <div class="task-col" data-status="done">
            <h4><span><i class="fas fa-check-circle"></i> Done</span> <span class="count" id="doneCount">0</span></h4>
            <div id="doneList" class="task-list"></div>
          </div>
        </div>
      </div>

      <!-- Velocity -->
      <div class="velocity-section">
        <span class="label"><i class="fas fa-chart-line"></i> Sprint Velocity</span>
        <span class="value" id="velocityValue">0</span>
        <button class="reset-btn" id="resetAllBtn"><i class="fas fa-undo-alt"></i> Reset All</button>
      </div>

      <!-- History -->
      <div class="history-panel" id="historyPanel">
        <h4><i class="fas fa-clock"></i> Activity Log</h4>
        <div id="historyList">
          <div class="history-item" style="opacity:0.6;"><span>No activity yet — start adding stories!</span></div>
        </div>
      </div>

      <div class="footer-bar">
        <span><i class="fas fa-shield-alt"></i> Madhura Karangale ·CS23006</span>
        <!-- <span><i ></i> CS23006</span> -->
      </div>
    </div>
  </div>
</div>

<!-- External JavaScript -->
<script src="script.js"></script>
</body>
</html>
